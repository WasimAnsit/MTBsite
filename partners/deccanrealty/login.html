<body>
  <div style="
        background-image: url('https://res.cloudinary.com/df1kus7ro/image/upload/f_auto,q_auto/v1/MTEstates/ej6og4lcfgbxhbyu6chn');
        background-size: cover;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      ">
    <h5 class="text-danger text-center ng-star-inserted" style="
          display: none;
          position: absolute;
          top: 10px;
          left: 50%;
          transform: translateX(-50%);
        " id="invalidUser-logino" style="display: none">
      Password looks incorrect!
    </h5>

    <div style="
          width: 370px;
          height: 530px; /* Increased height for better alignment */
          background-color: #b1923f;
          padding-top: 10px;
          border-radius: 1rem;
          text-align: center;
        ">
      <span style="
            color: white;
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
          ">
        <i class="fa fa-lock" style="font-size: 24px"> &nbsp;</i>SECURE LOGIN
      </span>
      <div style="
            width: 360px;
            height: 470px; /* Adjusted height to better fill the parent container */
            background-color: whitesmoke;
            margin: 10px auto 0; /* Centered with auto margins */
            border-radius: 0.5rem;
          ">
        <div class="imgcontainero">
          <div style="
                font-size: 22px;
                font-weight: 500;
                color: #8f7632;
                margin-bottom: 5px;
              ">
            Partner Panel
          </div>
          <a href="https://deccanrealty.com"><img src="https://res.cloudinary.com/df1kus7ro/image/upload/f_auto,q_auto/v1/MTEstates/logos/qahgenesczx8uvhrxzyy" alt="Deccan Realty Logo"
              class="avataro" /></a>
          <div style="margin-top: 5px; font-weight: 500; color: #8f7632;">App & CRM</div>
        </div>
        <div style="margin-top: 0%; width: 100%;" id="loginEmailo">
          <div class="form_container">
            <div class="form-group" style="position: relative">
              <div class="input_wrap">
                <input type="text" placeholder="" required class="form-control floatingLabel"
                  style="background-color: white" type="text" placeholder="" required
                  class="form-control floatingLabel clsPopup" name="unameo" id="email-logino"
                  onblur="addRequired('email-logino')" oninput="removeValidationo(true)"
                  onkeydown="if(event.key===' ')event.preventDefault();" />

                <label style="margin-left: 10px"><i class="fa fa-user"
                    style="font-size: 16px"></i>&nbsp;&nbsp;Email</label>
              </div>
              <small class="text-danger" style="display: none; position: absolute; left: 0; bottom: -20px; color: red"
                id="notValidEmailLogino">* Invalid Email</small>
              <small class="text-danger" style="display: none; position: absolute; left: 0; bottom: -20px;"
                id="email-req-logino">* Required</small>
              <small class="text-danger" style="display: none; position: absolute; left: 0; bottom: -20px; color: red"
                id="emaildoesnotexist-logino">* Email id does not exist in the system</small>
            </div>
            <button class="buttono" onclick="nextOrPreviousStepAdmin(true, 'deccanrealty.com')" id="adminControl">
              <span id="continue_text">Continue</span>
              <i class="fa fa-spinner fa-spin" id="emailSpinnero"
                style="display: none; color: white; font-size: 16px; margin-left: 5px;"></i>
            </button>
          </div>
          <label>
            <span class=""><a style="text-decoration: none; color: #ff7b2a;" href="https://deccanrealty.com">Back to
                Website</a></span>
          </label>
          <div>
            <span class="" id="copyrightText" style="text-decoration: none; color: black">
              ©2022&nbsp;MT Estates | deccanrealty.com
            </span>
          </div>
        </div>

        <div style="margin-top: 0%; display: none; width: 100%;" id="loginOTPo">
          <div class="form_container">
            <div class="form-group" style="position: relative">
              <div class="input_wrap">
                <input type="text" placeholder="" onblur="addRequired('otp-login')" style="background-color: white"
                  class="form-control floatingLabel" required name="inputo" id="otp-login" maxlength="6"
                  oninput="removeValidation(false)" onkeydown="if(event.key===' ')event.preventDefault();">
                <label style="margin-left: 10px">
                  <i class="fa fa-key" style="font-size: 16px"></i>&nbsp;&nbsp;Enter OTP
                </label>
              </div>
              <small class="text-danger" style="display: none; position: absolute; left: 0; bottom: -20px; color: red"
                id="otp-req-logino">* Required</small>
            </div>
            <button class="buttono" id="adminLogin" onclick="verifyOTP()">
              <span id="otp_text">Verify OTP</span>
              <i class="fa fa-spinner fa-spin" id="loginspinnero" style="display: none;"></i>
            </button>
          </div>
          <label>
            <span class=""><a style="text-decoration: none; color: #ff7b2a" href="https://deccanrealty.com">Back to
                Website</a></span>
          </label>
          <div>
            <span class="" id="copyrightText" style="text-decoration: none; color: black">
              ©2022&nbsp;MT Estates | deccanrealty.com
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var startYear = 2022; // Changed from 2023 to 2022
      var currentYear = new Date().getFullYear();
      var copyrightText = document.getElementById("copyrightText");

      if (currentYear > startYear) {
        copyrightText.innerHTML = `©${startYear}-${currentYear} MT Estates | <a href="https://deccanrealty.com" style="color: #ff7b2a; text-decoration: none;">deccanrealty.com</a>`;
      } else {
        copyrightText.innerHTML = `©${startYear} MT Estates | <a href="https://deccanrealty.com" style="color: #ff7b2a; text-decoration: none;">deccanrealty.com</a>`;
      }
    });
  </script>
  <script>
    const adminControlButton = document.getElementById("adminControl");
    const adminLoginButton = document.getElementById("adminLogin");
    let enterPressed = false;

    document.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !enterPressed) {
        enterPressed = true;
        if (document.activeElement.id === "email-logino") {
          adminControlButton.click();
        } else if (document.activeElement.id === "password-login") {
          adminLoginButton.click();
        }
      }
    });

    document.addEventListener("keyup", function (event) {
      if (event.key === "Enter") {
        enterPressed = false;
      }
    });
  </script>
