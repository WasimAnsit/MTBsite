<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    />
    <meta
      name="description"
      content="Home is where the heart is!,No matter you are renting, selling or buying a property in Delhi NCR We are here for you to help!"
    />
    <link rel="canonical" href="https://mtestates.bsite.net/" />
    <meta property="og:title" content="https://mtestates.bsite.net/" />
    <meta property="og:site_name" content="dncrproperty.com" />
    <meta property="og:type" content="website" />
    <meta
      property="og:description"
      content="Properties to buy in city,Let's start your journey with us, your dream will come true"
    />

    <meta name="author" content="dncrproperty.com" />
    <meta name="googlebot" content="index, follow" />
    <meta name="yahooseeker" content="index, follow" />
    <meta name="msnbot" content="index, follow" />
    <meta name="robots" content="index, follow" />
    <meta name="distribution" content="INDIA" />
    <meta name="revisit-after" content="3 days" />
    <meta name="rating" content="general" />
    <meta name="language" content="en-us" />
    <meta name="document-type" content="Public" />
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/df1kus7ro/image/upload/f_auto,q_auto/v1/MTEstates/logos/yjtyvsdd01ygbyrpokfo" />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link href="../../assets/css/index.css" rel="stylesheet" />
    <link href="../../assets/css/responsive.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css"> 
    <script src="../app.js"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  </head>

  <body>
    <div
      style="
        position: relative;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      "
    >
      <!-- Background image with overlay -->
      <div
        style="
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background-image: url('https://res.cloudinary.com/df1kus7ro/image/upload/f_auto,q_auto/v1/MTEstates/mulvci3vbcquynpgdczn');
          background-size: cover;
          background-position: center;
          z-index: -2;
        "
      ></div>
      
      <!-- Black transparent overlay -->
      <div
        style="
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background-color: rgba(0, 0, 0, 0.4); /* 60% opacity black */
          z-index: -1;
        "
      ></div>

      <!-- Content goes here, keep this part -->
      <h5
        class="text-danger text-center ng-star-inserted"
        style="
          display: none;
          position: absolute;
          top: 10px;
          left: 50%;
          transform: translateX(-50%);
        "
        id="invalidUser-logino"
      >
        Password looks incorrect!
      </h5>

      <div
        style="
          width: 370px;
          height: 520px;
          background-color: #E03486;
          padding-top: 10px;
          border-radius: 1rem;
          text-align: center;
          z-index: 1;
        "
      >
        <span
          style="
            color: white;
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
          "
        >
          <i class="fa fa-lock" style="font-size: 24px"> &nbsp;</i>SECURE LOGIN
        </span>
        <div
          style="
            width: 360px;
            height: 460px;
            background-color: whitesmoke;
            margin: 10px auto 0;
            border-radius: 0.5rem;
          "
        >
          <div class="imgcontainero">
            <div style="
                  font-size: 22px;
                  font-weight: 500;
                  color: #8F2C71;
                  margin-bottom: 20px;
                ">
              Partner Panel
            </div>
            <a href="https://dncrproperty.com"
              ><img
                src="https://res.cloudinary.com/df1kus7ro/image/upload/f_auto,q_auto/v1/MTEstates/logos/yjtyvsdd01ygbyrpokfo"
                alt="DNCR Property Logo"
                class="avataro"
            /></a>
            <div style="margin-top: 5px; font-weight: 500; color: #8F2C71;">App & CRM</div>
          </div>
          <div style="margin-top: 0%; width: 100%" id="loginEmailo">
            <div class="form_container">
              <div class="form-group" style="position: relative">
                <div class="input_wrap">
                  <input
                    type="text"
                    placeholder=""
                    required
                    class="form-control floatingLabel"
                    style="background-color: white"
                    name="unameo"
                    id="email-logino"
                    onblur="addRequired('email-logino')"
                    oninput="removeValidationo(true)"
                    onkeydown="if(event.key===' ')event.preventDefault();"
                  />

                  <label style="margin-left: 10px"
                    ><i class="fa fa-user" style="font-size: 16px"></i
                    >&nbsp;&nbsp;Email</label
                  >
                </div>
                <small
                  class="text-danger"
                  style="display: none; position: absolute; left: 0; bottom: -20px; color: red"
                  id="notValidEmailLogino"
                  >* Invalid Email</small
                >
                <small
                  class="text-danger"
                  style="display: none; position: absolute; left: 0; bottom: -20px;"
                  id="email-req-logino"
                  >* Required</small
                >
                <small
                  class="text-danger"
                  style="display: none; position: absolute; left: 0; bottom: -20px; color: red"
                  id="emaildoesnotexist-logino"
                  >* Email id does not exist in the system</small
                >
              </div>
              <button
                class="buttono"
                onclick="nextOrPreviousStepAdmin(true, 'dncrproperty.com')"
                id="adminControl"
              >
                <span id="continue_text">Continue</span>
                <i
                  class="fa fa-spinner fa-spin"
                  id="emailSpinnero"
                  style="display: none; color: white; font-size: 16px; margin-left: 5px;"
                ></i>
              </button>
            </div>
            <label>
              <span class=""
                ><a
                  style="text-decoration: none; color: #ee8032"
                  href="https://dncrproperty.com"
                  >Back to Website</a
                ></span
              >
            </label>
            <div>
              <span
                class=""
                id="copyrightText"
                style="text-decoration: none; color: black"
              >
                ©2022&nbsp;MT Estates | dncrproperty.com
              </span>
            </div>
          </div>

          <div
            style="margin-top: 0%; display: none; width: 100%;"
            id="loginOTPo"
          >
            <div class="form_container">
              <div class="form-group" style="position: relative">
                <div class="input_wrap">
                  <input
                    type="text"
                    placeholder=""
                    onblur="addRequired('otp-login')"
                    style="background-color: white"
                    class="form-control floatingLabel"
                    required
                    name="inputo"
                    id="otp-login"
                    maxlength="6"
                    oninput="removeValidation(false)"
                    onkeydown="if(event.key===' ')event.preventDefault();"
                  />
                  <label style="margin-left: 10px">
                    <i class="fa fa-key" style="font-size: 16px"></i
                    >&nbsp;&nbsp;Enter OTP
                  </label>
                </div>
                <small
                  class="text-danger"
                  style="display: none; position: absolute; left: 0; bottom: -20px; color: red"
                  id="otp-req-logino"
                >
                  * Required
                </small>
              </div>
              <button
                class="buttono"
                id="adminLogin"
                onclick="verifyOTP()"
              >
                <span id="otp_text">Verify OTP</span>
                <i
                  class="fa fa-spinner fa-spin"
                  id="loginspinnero"
                  style="display: none; color: white; font-size: 16px; margin-left: 5px;"
                ></i>
              </button>
            </div>
            <label>
              <span class=""
                ><a
                  style="text-decoration: none; color: #ee8032"
                  href="https://dncrproperty.com"
                  >Back to Website</a
                ></span
              >
            </label>
            <div>
              <span
                class=""
                id="copyrightText"
                style="text-decoration: none; color: black"
              >
                ©2022&nbsp;MT Estates | dncrproperty.com
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var startYear = 2022;
        var currentYear = new Date().getFullYear();
        var copyrightText = document.getElementById("copyrightText");

        if (currentYear > startYear) {
          copyrightText.innerHTML = `©${startYear}-${currentYear} MT Estates | <a href="https://dncrproperty.com" style="color: #ee8032; text-decoration: none;">dncrproperty.com</a>`;
        } else {
          copyrightText.innerHTML = `©${startYear} MT Estates | <a href="https://dncrproperty.com" style="color: #ee8032; text-decoration: none;">dncrproperty.com</a>`;
        }
      });
    </script>
    <script>
      const adminControlButton = document.getElementById("adminControl");
      const adminLoginButton = document.getElementById("adminLogin");
      let enterPressed = false;

      document.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !enterPressed) {
          enterPressed = true;
          if (document.activeElement.id === "email-logino") {
            adminControlButton.click();
          } else if (document.activeElement.id === "otp-login") {
            adminLoginButton.click();
          }
        }
      });

      document.addEventListener("keyup", function (event) {
        if (event.key === "Enter") {
          enterPressed = false;
        }
      });
    </script>
  </body>
</html>
